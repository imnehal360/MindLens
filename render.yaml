services:
  - type: web
    name: mindlens-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HF_SPACE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: API_BASE
        value: http://localhost:8000
    autoDeploy: false

  - type: web
    name: mindlens-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    envVars:
      - key: API_BASE
        fromService:
          type: web
          name: mindlens-backend
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: false
